name: Aprendiendo github actions
run-name: Estoy aprendiendo github actions!!!

on: [push]
jobs:
  setup-java:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v3.12.0
        with:
          distribution: oracle
          java-version: 17
          java-package: jdk
  run-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/@Checkout@v2
      - name: Compile and run Java code
        run: |
            javac Entrada.java
            java Entrada